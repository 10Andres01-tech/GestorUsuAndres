<!DOCTYPE html>
<html>
    <head>
        <title>Principal</title>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    </head>
    <body class="container mt-5">
        <h2>Editar Usuarios</h2>

        <form method="POST" action="{{ url_for('actualizar_usuario') }}">
           <input type="hidden" name="id" value="{{ usu[0] }}">

            <div class="mb-3">
                <label>Usuario</label>
                <input type="text" name="txtusuario" class="form-control" value="{{ usu[1] }}" placeholder="Ingrese el usuario">
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="txtpassword" class="form-control" value="{{ usu[2] }}" placeholder="Ingrese la contraseña">
            </div>

            <div class="mb-3">
                <label>Rol</label>
                    <input type="text" name="txtrol" class="form-control" value="{{ usu[3] }}" disabled placeholder="Ingrese el rol">
            </div>

            <div class="mb-3">
                <label>Documento</label>
                <input type="text" name="txtdocumento" class="form-control" value="{{ usu[4] }}" disabled placeholder="Ingrese el documento">
            </div>

            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="{{ url_for('index') }}" class="btn btn-danger">Cancelar</a>
        </form>
    </body>
</html>
