<!DOCTYPE html>
<html>
<head>
    <title>Editar Perfil</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2 class="text-center">Editar Mi Perfil</h2>

    <form method="POST" action="{{ url_for('actualizar_perfil') }}">

        <input type="hidden" name="id" value="{{ emp[0] }}">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="txtnombre" class="form-control" value="{{ emp[2] }}">
        </div>

        <div class="mb-3">
            <label>Apellido</label>
            <input type="text" name="txtapellido" class="form-control" value="{{ emp[3] }}">
        </div>

        <div class="mb-3">
            <label>Cargo</label>
            <select name="txtcargo" class="form-select">
                <option value="gerente" {% if emp[4] == 'gerente' %}selected{% endif %}>Gerente</option>
                <option value="administrador" {% if emp[4] == 'administrador' %}selected{% endif %}>Administrador</option>
                <option value="contador" {% if emp[4] == 'contador' %}selected{% endif %}>Contador</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Departamento</label>
            <select name="txtid_dep" class="form-select">
                <option value="1" {% if emp[11] == 1 %}selected{% endif %}>RR.HH</option>
                <option value="2" {% if emp[11] == 2 %}selected{% endif %}>Sistemas</option>
                <option value="3" {% if emp[11] == 3 %}selected{% endif %}>Contabilidad</option>
                <option value="4" {% if emp[11] == 4 %}selected{% endif %}>Administración</option>
                <option value="5" {% if emp[11] == 5 %}selected{% endif %}>Cafetería</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a href="{{ url_for('perfil_empleado') }}" class="btn btn-danger">Cancelar</a>

    </form>

</body>
</html>
