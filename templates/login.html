<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #d495ff, #c9f780);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin-top: 40px;
    color: #ffffff;
    font-size: 2.5rem;
    text-align: center;
    letter-spacing: 2px;
}

/* 🔥 CAJA LOGIN */
.login-container {
    margin-top: 50px;
    background: rgba(255, 255, 255, 0.075);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
    width: 300px;
}

/* inputs */
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

/* botón */
button {
    width: 100%;
    padding: 10px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #084298;
}
</style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="col-md-4">
    <div class="card login-card p-4">

        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <!-- Mensajes -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{category}} text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="txtusuario" class="form-control" placeholder="Ingrese su usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="txtcontrasena" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>

            <!-- LINK OLVIDÉ CONTRASEÑA -->
            <div class="d-flex justify-content-end mb-3">
                <a href="/recuperar" class="link-recuperar text-primary">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    Ingresar
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
