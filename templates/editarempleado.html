<!DOCTYPE html>
<html>
    <head>
        <title>Principal</title>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    </head>
    <body class="container mt-5">
        <h2>Editar Empleados</h2>

        <form method="POST" action="{{ url_for('actualizar_empleado') }}">
           <input type="hidden" name="id" value="{{ emp[0] }}">

            <div class="mb-3">
                <label>Documento</label>
                <input type="text" name="txtdocumento" class="form-control" value="{{ emp[1] }}" disabled placeholder="Ingrese el documento">
            </div>

            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" name="txtnombre" class="form-control" value="{{ emp[2] }}" placeholder="Ingrese el nombre">
            </div>

            <div class="mb-3">
                <label>Apellido</label>
                <input type="text" name="txtapellido" class="form-control" value="{{ emp[3] }}" placeholder="Ingrese el apellido
                ">
            </div>

            <div class="mb-3">
                <label>Cargo</label>
                    <input type="text" name="txtcargo" class="form-control" value="{{ emp[4] }}" placeholder="Ingrese el cargo">
            </div>

            <div class="mb-3">
                <label>Horas Extras</label>
                <input type="number" name="txthorasextras" class="form-control" value="{{ emp[6] }}" placeholder="Ingrese las horas extras">
            </div>

            <div class="mb-3">
                <label>Bonificación</label>
                <input type="number" name="txtbonificacion" class="form-control" value="{{ emp[7] }}" placeholder="Ingrese la bonificación">
            </div>
             <div class="mb-3">
                <label>Departamento</label>
                <select name="txtid_dep" class="form-select">
                    {% for d in departamentos %}
                        <option value="{{ d[0] }}" {% if emp[11] == d[0] %}selected{% endif %}>
                            {{ d[1] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="{{ url_for('index') }}" class="btn btn-danger">Cancelar</a>
        </form>
    </body>
</html>
